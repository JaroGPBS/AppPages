<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JaroGPBS — strony aplikacji</title>
  <meta name="description" content="Oficjalne strony informacyjne aplikacji JaroGPBS.">
  <style>
    :root{color-scheme:dark;--bg:#0b0d12;--card:#141821;--text:#f5f7fb;--muted:#a8b0bf;--accent:#ff3b4f}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#0b0d12,#10141c);color:var(--text)}
    main{max-width:820px;margin:0 auto;padding:56px 20px 80px}h1{font-size:34px;margin:0 0 10px}.lead{color:var(--muted);margin:0 0 34px;line-height:1.6}
    .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid #252c39;border-radius:18px;padding:22px;margin:14px 0;transition:.18s transform,.18s border-color}
    .card:hover{transform:translateY(-2px);border-color:#3a4456}.tag{display:inline-block;color:#fff;background:var(--accent);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
    h2{margin:0 0 8px;font-size:22px}.small{color:var(--muted);line-height:1.55}footer{margin-top:48px;color:#7f8999;font-size:13px}
  </style>
</head>
<body>
<main>
  <h1>JaroGPBS — strony aplikacji</h1>

  <a class="card" href="./faktury-gpbs/">
    <span class="tag">ANDROID</span>

  </a>

  <footer>Kontakt: j.juszczyk@gpbs.pl</footer>
</main>
</body>
</html>
